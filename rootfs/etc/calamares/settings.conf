---
modules-search: [ local, /usr/lib/calamares/modules ]

# A module instance that uses the "module@id" syntax below only loads a configuration file named
# after the module itself unless the instance is declared here with an explicit configuration file.
# Without this, both of the "shellprocess" instances silently do nothing.
instances:
- module: shellprocess
  id: prepare
  config: shellprocess_prepare.conf
- module: shellprocess
  id: unpack
  config: shellprocess_unpack.conf
- module: shellprocess
  id: postcfg
  config: shellprocess_postcfg.conf

# The "locale" and "localecfg" modules are deliberately not used. The time zone and the locale are
# both configured by the winesapOS first-time setup after the installation, and the installation is
# a copy of the live media so it already has a working locale.
sequence:
  - show:
      - welcome
      - partition
      - keyboard
      - summary
  - exec:
      - shellprocess@prepare
      - partition
      - mount
      - shellprocess@unpack
      - machineid
      - fstab
      - keyboard
      - hwclock
      - shellprocess@postcfg
      - bootloader
      - umount
  - show:
      - finished

branding: winesapos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false
