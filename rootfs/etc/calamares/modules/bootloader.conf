---
efiBootLoader: grub

grubInstall: grub-install

grubMkconfig: grub-mkconfig

grubCfg: /boot/grub/grub.cfg

efiBootloaderId: winesapOS

# Also install GRUB as the EFI fallback loader at "\EFI\BOOT\BOOTX64.EFI". winesapOS runs on a lot
# of hardware with unreliable UEFI boot entries, such as T2 Macs and handhelds, where this is the
# only path that works. The winesapOS image itself is built the same way by using
# 'grub-install --removable'. On a dual-boot installation this replaces the fallback loader of the
# other operating system, which still boots from its own UEFI boot entry.
installEFIFallback: true

# The kernel and initramfs are deliberately not configured here. GRUB finds them itself with
# 'grub-mkconfig'. The "kernel", "img", "fallback" and "timeout" keys are only used by the
# systemd-boot and refind boot loaders and are ignored when 'efiBootLoader' is "grub".
