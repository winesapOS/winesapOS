---
# The flat "efiSystemPartition", "efiSystemPartitionSize" and "efiSystemPartitionName" keys are
# deprecated aliases of these. The size matches the EFI partition that the winesapOS image is built
# with, which is large enough to also hold kernels when systemd-boot is used instead of GRUB.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize: 32MiB
    label: "WOS-EFI2"

userSwapChoices:
    - none

drawNestedPartitions: false
alwaysShowPartitionLabels: true

defaultPartitionTableType: gpt

defaultFileSystemType: btrfs

availableFileSystemTypes:
    - btrfs

requiredPartitionTableType:
    - gpt

# There is no "defaultPartitioningChoice" key. Only "initialPartitioningChoice" is read.
initialPartitioningChoice: alongside
initialSwapChoice: none

partitionLayout:
    - name: "winesapos-boot2"
      filesystem: "ext4"
      mountPoint: "/boot"
      size: 1G
    - name: "winesapos-root2"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
