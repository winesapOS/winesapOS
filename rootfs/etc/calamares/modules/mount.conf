---
# The "options" of each entry must be an array. A plain string is silently ignored, which leaves the
# bind mounts missing and makes 'mkinitcpio' fail with "/dev must be mounted!".
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # 'grub-install' needs this to write the UEFI boot entry.
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# winesapOS mounts the top-level of the Btrfs file system as the root file system, not a named
# subvolume such as "@". An empty subvolume name tells Calamares to not create one for that mount
# point. The remaining names must match the subvolumes that 'scripts/winesapos-install.sh' creates
# so that the Snapper configurations and the swap file location from the tarball are correct.
# The nested "/home/.snapshots" subvolume is created by 'winesapos-install-rootfs.sh' instead
# because Calamares cannot create nested subvolumes.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: ""
    - mountPoint: /home
      subvolume: /home
    - mountPoint: /swap
      subvolume: /swap
    - mountPoint: /.snapshots
      subvolume: /.snapshots

# Each entry must be an array of individual options. A single comma-separated string makes the
# module fail with "AttributeError: 'str' object has no attribute 'copy'".
# The 'fstab' module reuses these for /etc/fstab, so they match the mount options that
# 'scripts/winesapos-install.sh' writes when building the image.
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ rw, relatime, "fmask=0022", "dmask=0022", "codepage=437", "iocharset=iso8859-1", "shortname=mixed", "errors=remount-ro" ]
    - filesystem: ext4
      options: [ rw, relatime ]
    - filesystem: btrfs
      options: [ rw, noatime, nodiratime, "commit=300", "compress-force=zstd:1", discard, "space_cache=v2" ]
